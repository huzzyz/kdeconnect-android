name: Rebase onto upstream and release

# Keeps this fork current with upstream KDE Connect.
#
# Runs on GitHub-hosted runners: this repo is public, so the minutes are free
# and no self-hosted runner is needed.
#
# The patch is deliberately tiny (see SHIZUKU-CLIPBOARD.md), so the rebase is
# normally uneventful. When it is not, this fails loudly, retains diagnostics,
# and opens an issue when Issues are enabled rather than publishing a stale or
# half-applied build.

on:
  # daily poll for new upstream tags; off-the-hour to avoid the cron stampede
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (blank = latest)'
        required: false
      dry_run:
        description: 'Build and verify, but do not push or publish'
        required: false
        type: boolean
        default: false

permissions:
  contents: write                  # push the rebased branch, create releases
  issues: write                    # report a failed rebase

jobs:
  rebase-build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork (full history — rebase needs it)
        uses: actions/checkout@v7
        with:
          ref: shizuku-clipboard
          fetch-depth: 0

      - name: Add upstream and fetch tags
        run: |
          git remote add upstream https://github.com/KDE/kdeconnect-android.git
          git fetch --quiet upstream --tags

      - name: Work out base and target tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          BASE=$(cat .upstream-base)
          if [ -n "$REQUESTED_TAG" ]; then
            TARGET="$REQUESTED_TAG"
          else
            # Newest vX.Y.Z tag by version order, not by date: upstream
            # occasionally tags older branches, and date order would pick those.
            # Query UPSTREAM directly. `git tag -l` sees local tags too, and our
            # own release tags (v1.35.11-shizuku) sort ABOVE upstream's
            # (v1.35.11), so it would pick our own release as the rebase target,
            # duplicate the patch onto it, publish v...-shizuku-shizuku, and
            # compound daily.
            TARGET=$(git ls-remote --tags --refs upstream 'v[0-9]*' \
                     | awk -F/ '{print $NF}' | sort -V | tail -1)
          fi
          echo "base=$BASE"     >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Base: $BASE   Target: $TARGET"
          RELEASE_TAG="${TARGET}-shizuku"
          RELEASE_ASSET="kdeconnect-shizuku-${TARGET}.apk"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_asset=$RELEASE_ASSET" >> "$GITHUB_OUTPUT"

          # Proceed when: there is a newer tag, OR a tag was named explicitly
          # (deliberate rebuild/first release), OR this is a dry run. Without the
          # explicit-tag case there is no way to publish the FIRST release, since
          # base and target match until upstream moves.
          if [ "$BASE" = "$TARGET" ] \
             && [ "$DRY_RUN" != "true" ] \
             && [ -z "$REQUESTED_TAG" ]; then
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$RELEASE_ASSET"; then
              echo "already=true" >> "$GITHUB_OUTPUT"
              echo "Newest upstream tag and its APK release already exist."
            else
              echo "already=false" >> "$GITHUB_OUTPUT"
              echo "Upstream base is current, but the release asset is absent; rebuilding it."
            fi
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            # A dry run exercises build + verification even when there is no new
            # tag. Untested release automation is its own silent-failure risk.
            # NOTE: an `[ ... ] && echo` as the LAST command in a branch returns
            # its exit status, which kills the step under `bash -e`. Use if/fi.
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run: building without publishing."
            fi
          fi

      - name: Rebase the patch onto the new tag
        if: steps.tags.outputs.already == 'false' && steps.tags.outputs.base != steps.tags.outputs.target
        id: rebase
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          set +e
          git rebase --onto "${{ steps.tags.outputs.target }}" "${{ steps.tags.outputs.base }}" shizuku-clipboard
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            DIAGNOSTICS="$RUNNER_TEMP/rebase-conflict"
            mkdir -p "$DIAGNOSTICS"
            git diff --name-only --diff-filter=U | tee "$DIAGNOSTICS/conflicting-files.txt"
            git diff > "$DIAGNOSTICS/rebase-conflict.patch"
            {
              echo "## Rebase conflict"
              echo
              echo "Rebase from \`${{ steps.tags.outputs.base }}\` onto \`${{ steps.tags.outputs.target }}\` failed."
              echo
              echo "Conflicting files:"
              sed 's/^/- `/' "$DIAGNOSTICS/conflicting-files.txt" | sed 's/$/`/'
              echo
              echo "A \`rebase-conflict-diagnostics\` artifact contains the file list and conflict patch."
            } >> "$GITHUB_STEP_SUMMARY"
            git rebase --abort || true
            echo "::error::Rebase onto ${{ steps.tags.outputs.target }} conflicted. Resolve by hand."
            exit 1
          fi
          echo "${{ steps.tags.outputs.target }}" > .upstream-base
          git add .upstream-base
          git commit -q -m "Track upstream ${{ steps.tags.outputs.target }}"

      - name: Verify the patch actually survived the rebase
        if: steps.tags.outputs.already == 'false'
        run: |
          # A rebase can succeed mechanically while dropping the hunk we exist
          # for. A green build that lost the feature is worse than a red one.
          F=src/main/java/org/kde/kdeconnect/plugins/clipboard/ClipboardListener.kt
          grep -q 'Shizuku.newProcess' "$F" \
            || { echo "::error::Shizuku.newProcess missing from $F after rebase"; exit 1; }
          grep -q 'addBinderDeadListener' "$F" \
            || { echo "::error::Shizuku binder recovery missing from $F after rebase"; exit 1; }
          grep -q 'dev.rikka.shizuku:api' build.gradle.kts \
            || { echo "::error::Shizuku dependency missing from build.gradle.kts"; exit 1; }
          grep -q 'org.kde.kdeconnect_tp.shizuku' build.gradle.kts \
            || { echo "::error::fork applicationId missing — would install over official KDE Connect"; exit 1; }
          echo "Patch intact."

      - name: Set up JDK 17
        if: steps.tags.outputs.already == 'false'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        if: steps.tags.outputs.already == 'false'
        uses: android-actions/setup-android@v4

      - name: Decode signing keystore
        if: steps.tags.outputs.already == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # A STABLE key is required. Obtainium (and Android) refuse an update
          # signed with a different key than the installed app, so a rotating or
          # per-run keystore silently breaks updates with
          # INSTALL_FAILED_UPDATE_INCOMPATIBLE.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Refusing to publish an unsignable build."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        if: steps.tags.outputs.already == 'false'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --console=plain
          ./gradlew assembleRelease --console=plain \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Name the artifact predictably
        if: steps.tags.outputs.already == 'false'
        id: apk
        run: |
          # Obtainium matches on a stable asset name; a hash-suffixed filename
          # would break its update detection.
          SRC=$(find . -path '*/release/*.apk' -name '*.apk' | head -1)
          [ -n "$SRC" ] || { echo "::error::no release APK produced"; exit 1; }
          OUT="kdeconnect-shizuku-${{ steps.tags.outputs.target }}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      - name: Confirm the built APK is the fork, not upstream
        if: steps.tags.outputs.already == 'false'
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump badging "${{ steps.apk.outputs.path }}" | grep -q "org.kde.kdeconnect_tp.shizuku" \
            || { echo "::error::built APK does not carry the fork applicationId"; exit 1; }
          echo "APK identity verified."

          # Verify the SIGNER too. Identity alone is not enough: if signing
          # silently fell back to a debug key the build would publish fine and
          # then fail to install as an update
          # (INSTALL_FAILED_UPDATE_INCOMPATIBLE), stranding every existing user.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          EXPECTED=$(tr -d '[:space:]' < .signing-cert-sha256)
          ACTUAL=$("$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}" \
                   | grep -i 'SHA-256 digest' | head -1 \
                   | sed 's/.*: *//' | tr -d '[:space:]' | tr 'A-Z' 'a-z')

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signer mismatch. expected=$EXPECTED actual=$ACTUAL"
            exit 1
          fi
          echo "APK signer verified ($ACTUAL)."

      - name: Retain verified APK for device testing
        if: steps.tags.outputs.already == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: kdeconnect-shizuku-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7
          if-no-files-found: error

      - name: Retain failed rebase diagnostics
        if: failure() && steps.rebase.outputs.conflict == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rebase-conflict-diagnostics
          path: ${{ runner.temp }}/rebase-conflict
          retention-days: 14
          if-no-files-found: error

      - name: Push the rebased branch
        if: steps.tags.outputs.already == 'false' && inputs.dry_run != true
        run: git push --force-with-lease origin shizuku-clipboard

      - name: Publish release
        if: steps.tags.outputs.already == 'false' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --repo is REQUIRED: in a fork checkout gh resolves the repo from
          # git remotes and prefers the PARENT, so this otherwise tries to
          # publish a release on KDE/kdeconnect-android and gets a 403.
          RELEASE_TAG="${{ steps.tags.outputs.release_tag }}"
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              "${{ steps.apk.outputs.path }}" \
              --title "KDE Connect (Shizuku) ${{ steps.tags.outputs.target }}" \
              --notes "Automatic clipboard sync via Shizuku, rebased onto upstream \
          [${{ steps.tags.outputs.target }}](https://github.com/KDE/kdeconnect-android/releases/tag/${{ steps.tags.outputs.target }}).

          See [the README](https://github.com/huzzyz/kdeconnect-android) for what this changes and why, and for credit.

          Requires [Shizuku](https://shizuku.rikka.app/) with permission granted. Installs as \`org.kde.kdeconnect_tp.shizuku\`, alongside official KDE Connect."
          fi

      - name: Keep the repo warm so the schedule is not auto-disabled
        if: "!failure() && !cancelled() && github.event_name == 'schedule'"
        run: |
          # GitHub disables scheduled workflows on repos with 60 days of no
          # activity. This fork only gets commits when upstream releases, so a
          # quiet upstream would silently switch off the very automation meant
          # to notice upstream releases -- invisible by construction.
          #
          # Commit only when genuinely close to the cutoff, so this does not
          # produce a commit per day.
          LAST=$(git log -1 --format=%ct)
          AGE_DAYS=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "Last commit was ${AGE_DAYS}d ago."
          if [ "$AGE_DAYS" -ge 45 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
            git add .heartbeat
            git commit -q -m "Heartbeat: keep the scheduled workflow enabled"
            git push origin shizuku-clipboard
            echo "Heartbeat committed."
          else
            echo "Repo is active enough; no heartbeat needed."
          fi

      - name: Report a failed rebase
        if: failure() && steps.rebase.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh repo view "${{ github.repository }}" --json hasIssuesEnabled --jq .hasIssuesEnabled)" != "true" ]; then
            echo "Issues are disabled; the rebase error above is the actionable failure." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Rebase onto ${{ steps.tags.outputs.target }} conflicted" \
            --body "The automatic rebase from \`${{ steps.tags.outputs.base }}\` onto \`${{ steps.tags.outputs.target }}\` did not apply cleanly, so no release was published.

          Most likely upstream touched \`ClipboardListener.kt\`. Resolve locally:

          \`\`\`
          git fetch upstream --tags
          git rebase --onto ${{ steps.tags.outputs.target }} ${{ steps.tags.outputs.base }} shizuku-clipboard
          # resolve, then:
          echo ${{ steps.tags.outputs.target }} > .upstream-base
          git add .upstream-base && git commit -m 'Track upstream ${{ steps.tags.outputs.target }}'
          git push --force-with-lease
          \`\`\`"
